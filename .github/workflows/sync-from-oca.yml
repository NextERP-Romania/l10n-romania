# Workflow pentru .github/workflows/sync-from-oca.yml — se pune în repo-ul
# `NextERP-Romania/l10n-romania` (și echivalent în alte repo-uri fork-uite din OCA).
#
# Scop:
#   În fiecare noapte, oglindește (mirror) toate branch-urile de versiune
#   (8.0 … 19.0) din `OCA/l10n-romania` în fork-ul NextERP-Romania, astfel
#   încât branch-urile fork-ului să fie IDENTICE cu cele din OCA.
#
#   ATENȚIE: aceasta este o sincronizare prin force-push. Orice commit local
#   existent pe aceste branch-uri în fork va fi suprascris. Dacă ai modificări
#   proprii, ține-le pe branch-uri separate (ex. `nexterp-19.0`), nu pe `19.0`.
#
# Setări necesare:
#   - Settings → Actions → "Read and write permissions"
#   - Secret `REGEN_PAT` (PAT cu scope `repo`); altfel se folosește GITHUB_TOKEN.

name: Sync from OCA

on:
  schedule:
    - cron: '0 2 * * *'   # zilnic la 02:00 UTC
  workflow_dispatch:
    inputs:
      branches:
        description: 'CSV branches to mirror (gol = toate versiunile 8.0…19.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (NextERP-Romania)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REGEN_PAT || secrets.GITHUB_TOKEN }}

      - name: Mirror OCA version branches into fork
        run: |
          set -euo pipefail
          git config user.name "nexterp-bot"
          git config user.email "bot@nexterp.ro"
          git remote add oca https://github.com/OCA/l10n-romania.git

          # Determină lista de branch-uri de sincronizat.
          INPUT="${{ github.event.inputs.branches }}"
          if [ -n "$INPUT" ]; then
            # Branch-uri date manual prin workflow_dispatch (CSV).
            BRANCHES=$(echo "$INPUT" | tr ',' ' ')
          else
            # Toate branch-urile din OCA care arată ca o versiune Odoo (ex. 8.0 … 19.0).
            BRANCHES=$(git ls-remote --heads oca \
              | sed -E 's#.*refs/heads/##' \
              | grep -E '^[0-9]+\.0$' \
              | sort -V)
          fi

          echo "Branch-uri de oglindit:"
          echo "$BRANCHES"

          for BR in $BRANCHES; do
            echo "::group::Mirror $BR"
            git fetch oca "$BR"
            # Suprascrie branch-ul din fork (origin) ca să fie identic cu OCA.
            git push --force origin "refs/remotes/oca/$BR:refs/heads/$BR" || \
              git push --force origin "FETCH_HEAD:refs/heads/$BR"
            echo "::endgroup::"
          done

      # Notifică odoo-nexterp să regenereze documentația Knowledge după sync.
      - name: Trigger knowledge regen in odoo-nexterp
        if: success() && env.REGEN_PAT != ''
        env:
          REGEN_PAT: ${{ secrets.REGEN_PAT }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${REGEN_PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/NextERP-Romania/odoo-nexterp/dispatches \
            -d '{"event_type":"knowledge-regen","client_payload":{"source":"l10n-romania","branch":"all"}}'
